<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>手机 Python 程序</title>
<style>
:root{
  --fs:15px;
  --lh:22px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;
  /* 纯白 + 淡色系（IDLE 风格） */
  --bg:#FFFFFF;      /* 页面主背景 */
  --bg2:#F9FAFB;     /* 面板 / 卡片 */
  --bg3:#F3F4F6;     /* 悬停 / 输出面板底 */
  --line:#E5E7EB;    /* 边框 / 分割线 */
  --fg:#333333;      /* 正文 */
  --dim:#9CA3AF;     /* 次要文字（行号 / 状态栏） */
  --teal:#14B8A6;    /* 主强调色 */
  --teal-d:#0D9488;  /* 主强调-激活 / 关键字 / 输入回显 */
  --violet:#A78BFA;  /* 次强调色 */
  --aux-y:#FDE68A;   /* 辅助黄（点缀） */
  --aux-p:#F9A8D4;   /* 辅助粉（点缀） */
  --outbg:#F3F4F6;   /* 输出面板底 */
  --err:#DC2626;     /* 错误提示 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
/* 按钮：白底 + 淡青边框 + 深灰字；激活时淡青底 + 白字 */
button{font:inherit;font-size:13px;color:var(--fg);background:#FFFFFF;border:1px solid var(--teal);
  border-radius:4px;padding:6px 10px;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  transition:background .12s linear,color .12s linear,border-color .12s linear}
button:active{background:var(--teal);border-color:var(--teal-d);color:#FFFFFF}
button.primary{background:#FFFFFF;border-color:var(--teal);color:var(--teal-d)}
button.primary:active{background:var(--teal-d);border-color:var(--teal-d);color:#FFFFFF}
button.save{background:#FFFFFF;border-color:var(--violet);color:#7C3AED}
button.save:active{background:var(--violet);border-color:var(--violet);color:#FFFFFF}
button:disabled{opacity:.5}
/* ---------- 顶栏 ---------- */
header{flex:none;display:flex;align-items:center;gap:5px;padding:6px 7px;background:var(--bg2);border-bottom:1px solid var(--line)}
#btnMenu,#btnSym{padding:6px 8px}
#btnRun,#btnRunSave{font-size:12px;padding:6px 8px}
#fname{flex:1;min-width:0;font-size:13.5px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding:4px 2px;color:var(--fg)}
#statusbar{flex:none;padding:2px 10px;font-size:11.5px;color:var(--dim);background:var(--bg2);
  border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
#statusbar.ok{color:#059669} #statusbar.warn{color:#B45309} #statusbar.err{color:var(--err)}
/* ---------- 编辑区（白底，行号浅灰） ---------- */
#editwrap{flex:1;display:flex;min-height:0;overflow:hidden;background:#FFFFFF}
#gutter{flex:none;width:4ch;overflow:hidden;background:#FFFFFF;border-right:1px solid var(--line)}
#ginner{padding:8px 6px 40px 0;font-family:var(--mono);font-size:calc(var(--fs) * .82);
  line-height:var(--lh);color:var(--dim);text-align:right;white-space:pre;will-change:transform}
#edbox{flex:1;position:relative;min-width:0}
#hlbox{position:absolute;inset:0;overflow:hidden}
#hl{margin:0;padding:8px 10px 40px;min-width:100%;width:max-content;
  font-family:var(--mono);font-size:var(--fs);line-height:var(--lh);white-space:pre;tab-size:4;
  font-variant-ligatures:none;will-change:transform}
#ed{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:8px 10px 40px;border:0;outline:0;resize:none;
  background:transparent;color:transparent;caret-color:var(--teal-d);overflow:auto;
  font-family:var(--mono);font-size:var(--fs);line-height:var(--lh);white-space:pre;tab-size:4;
  font-variant-ligatures:none}
#ed::selection{background:rgba(20,184,166,.22)}
/* 语法着色（严格按色板） */
.k1{color:#0D9488}   /* 关键字 def class import return ... 深青 */
.k2{color:#0D9488}   /* 关键字 if for while try ... 深青 */
.kc{color:#7C3AED}   /* self cls 深紫 */
.kbool{color:#D97706}/* True False None 深橙 */
.bi{color:#7C3AED}   /* 内置函数 print len range ... 深紫 */
.fn{color:#7C3AED}   /* 类名调用 深紫 */
.fn-user{color:#2563EB;font-weight:600} /* 自定义函数：亮蓝加粗 */
.st{color:#D97706}   /* 字符串 深橙 */
.nu{color:#059669}   /* 数字 深绿 */
.cm{color:#9CA3AF;font-style:italic} /* 注释 灰 */
.op{color:#333333}   /* 运算符 */
/* ---------- 报错 / 候选条 ---------- */
#errbar{flex:none;display:none;padding:4px 10px;font-size:11.5px;line-height:1.5;color:var(--err);
  background:#FEF2F2;border-top:1px solid var(--line);border-left:3px solid var(--aux-p);
  max-height:66px;overflow:auto;white-space:pre-wrap}
#errbar.show{display:block}
#candbar{flex:none;display:none;gap:6px;padding:5px 8px;background:var(--bg3);border-top:1px solid var(--line);
  overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
#candbar.show{display:block}
#candbar button{margin-right:6px;padding:5px 9px;border-radius:12px;background:#FFFFFF;border-color:var(--line);
  font-family:var(--mono);font-size:13px}
#candbar button.snip{background:var(--aux-y);border-color:#F5D77E;color:var(--fg)}
/* ---------- 符号栏（白底 + 淡紫边框，按下淡紫底白字） ---------- */
#symbar{flex:none;background:var(--bg2);border-top:1px solid var(--line);padding:4px 4px 6px}
#symbar.hide{display:none}
.srow{display:flex;gap:4px;overflow-x:auto;padding:2px 0;-webkit-overflow-scrolling:touch}
.srow::-webkit-scrollbar{height:0}
.srow button{flex:0 0 auto;min-width:34px;padding:7px 8px;font-family:var(--mono);font-size:14px;border-radius:4px;
  background:#FFFFFF;border-color:var(--violet);color:var(--fg)}
.srow button:active{background:var(--violet);border-color:var(--violet);color:#FFFFFF}
/* ---------- 输出面板（可拖动调高） ---------- */
#panel{flex:none;display:flex;flex-direction:column;height:32vh;max-height:50vh;min-height:40px;
  background:var(--outbg);border-top:1px solid var(--line)}
#panel.collapsed{height:auto;min-height:0}
#panel.dragging{transition:none;user-select:none}
#phandle{flex:none;height:15px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;
  touch-action:none;background:var(--bg2);border-bottom:1px solid var(--line)}
#phandle::before{content:"";width:46px;height:4px;border-radius:2px;background:var(--aux-p)}
#phandle:active::before{background:var(--violet)}
#phead{flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
#ptitle{flex:1;font-size:12.5px;color:var(--dim)}
#phead button{padding:4px 8px;font-size:12px}
#pstop{background:#FFFFFF;border-color:var(--err);color:var(--err);font-size:12px;padding:4px 9px}
#pstop:active{background:var(--err);border-color:var(--err);color:#FFFFFF}
#out{flex:1;margin:0;padding:8px 10px;overflow:auto;font-family:var(--mono);font-size:13px;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;color:#333333;-webkit-overflow-scrolling:touch}
#panel.collapsed #out{display:none}
#out .err{color:var(--err)}
#out .ok{color:#059669}
#out .cn{color:var(--teal-d)}
#out .sys{color:#7C3AED}
#out .warn{color:#92400E;background:var(--aux-y)}
#out .inp{color:#0D9488}   /* 修改 1：用户输入回显（淡青） */
/* ---------- 弹层 ---------- */
.overlay{position:fixed;inset:0;background:rgba(51,51,51,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{width:100%;max-width:520px;background:#FFFFFF;border:1px solid var(--violet);border-radius:10px 10px 0 0;
  padding:14px;max-height:86vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:16px;font-weight:600;color:var(--fg)}
.modal p.hint{margin:0 0 10px;font-size:12.5px;color:var(--dim);line-height:1.6}
.modal textarea{width:100%;background:#FFFFFF;color:var(--fg);border:1px solid var(--line);border-radius:4px;
  padding:8px;font-family:var(--mono);font-size:14px;line-height:1.5;resize:vertical}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.menu{display:flex;flex-direction:column;gap:6px}
.menu button{text-align:left;padding:11px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;
  background:#FFFFFF;border-color:var(--line);color:var(--fg)}
.menu button:active{background:var(--bg3);border-color:var(--teal);color:var(--teal-d)}
.menu button span.k{color:var(--dim);font-size:11.5px}
.help{font-size:13px;line-height:1.75;color:var(--fg)}
.help b{color:var(--teal-d)}
.help code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:12.5px;color:#7C3AED}
.help ul{padding-left:18px;margin:6px 0}
/* ---------- 文档视图（只读） ---------- */
#vdoc{display:none;flex:1;min-height:0;overflow:hidden;background:#FFFFFF}
#vdoc.show{display:flex;flex-direction:column}
#vdoc #vtitle{flex:none;padding:5px 10px;font-size:12.5px;color:var(--dim);background:var(--bg2);
  border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vdoc #vbody{flex:1;margin:0;padding:8px 10px 40px;overflow:auto;font-family:var(--mono);font-size:var(--fs);
  line-height:var(--lh);white-space:pre-wrap;word-break:break-word;color:var(--fg);-webkit-overflow-scrolling:touch}
#app.docmode #editwrap{display:none}
#app.docmode #symbar{display:none}
/* 安装 / 导出弹窗里的表单件 */
.modal select{width:100%;background:#FFFFFF;color:var(--fg);border:1px solid var(--line);border-radius:4px;
  padding:9px 8px;font:inherit;font-size:14px}
.modal input[type=text]{width:100%;background:#FFFFFF;color:var(--fg);border:1px solid var(--line);border-radius:4px;
  padding:9px 8px;font-family:var(--mono);font-size:14px}
.modal input[type=text]:focus,.modal select:focus{outline:0;border-color:var(--teal)}
#mCustom{margin-top:8px;display:none}
#mCustom.show{display:block}
.filelist{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg2);padding:4px}
.filelist label{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:4px;font-size:13.5px;color:var(--fg)}
.filelist label:active{background:var(--bg3)}
.filelist input[type=checkbox]{flex:none;width:17px;height:17px;accent-color:var(--teal)}
.filelist .fmeta{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
.filelist .fsize{flex:none;color:var(--dim);font-size:11.5px}
.filelist .empty{padding:12px 8px;color:var(--dim);font-size:13px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="btnMenu" title="菜单">☰</button>
    <div id="fname">未命名.py</div>
    <button id="btnSym" title="显示/隐藏符号栏">⌨</button>
    <button id="btnDoc" title="文档：只读查看虚拟盘里的文档">📄</button>
    <button id="btnImport" title="导入文档到虚拟盘（txt/csv/json/md/xlsx/xls）">📥</button>
    <button id="btnRun" class="primary">▶ 运行</button>
    <button id="btnRunSave" class="save">💾 保存并运行</button>
  </header>
  <div id="statusbar">就绪</div>

  <div id="editwrap">
    <div id="gutter"><div id="ginner">1</div></div>
    <div id="edbox">
      <div id="hlbox"><pre id="hl"></pre></div>
      <textarea id="ed" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    </div>
  </div>

  <!-- 新增 3：只读文档视图（与编辑器互斥显示） -->
  <div id="vdoc">
    <div id="vtitle">文档</div>
    <pre id="vbody"></pre>
  </div>

  <div id="errbar"></div>
  <div id="candbar"></div>

  <div id="symbar">
    <div class="srow" id="sym1"></div>
    <div class="srow" id="sym2"></div>
  </div>

  <section id="panel" class="collapsed">
    <div id="phandle" title="上下拖动调整高度"></div>
    <div id="phead">
      <span id="ptitle">输出</span>
      <button id="pcopy">复制</button>
      <button id="pclear">清空</button>
      <button id="ptoggle">展开</button>
      <button id="pstop" class="stop" title="强制停止运行">🛑 停止</button>
    </div>
    <pre id="out"></pre>
  </section>
</div>
<input type="file" id="fileInput" accept=".py,.txt,text/plain,text/x-python" style="display:none">
<!-- 新增 4：文档导入（含 Excel） -->
<input type="file" id="docInput" accept=".txt,.csv,.json,.md,.xlsx,.xls" style="display:none">

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var ed = $('ed'), hl = $('hl'), ginner = $('ginner'), gutter = $('gutter');
  var out = $('out'), panel = $('panel'), errbar = $('errbar'), candbar = $('candbar');
  var statusbar = $('statusbar'), fnameEl = $('fname'), symbar = $('symbar');
  var app = $('app'), vdoc = $('vdoc'), vtitle = $('vtitle'), vbody = $('vbody');
  var docFileList = null, importBusy = false, docViewActive = false, docPickSeq = 0;
  var FILTER_BASE = null;   /* 新增 2/3：记录“程序自己生成”的文件，排除 Python 自带模块 */
  var PY_URL = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/';
  var LS_NAME = 'pyed.name', LS_CODE = 'pyed.code', LS_FS = 'pyed.fs', LS_SYM = 'pyed.sym';
  var DEFAULT_NAME = '未命名.py';

  /* 修改 6 / 8：当前文件名，记住并在刷新后恢复 */
  var currentFileName = localStorage.getItem(LS_NAME) || DEFAULT_NAME;
  var fontSize = parseInt(localStorage.getItem(LS_FS), 10) || 15;
  var busy = 0, lastLines = 0, running = false, pyodide = null, loading = null;
  var candState = null, checkTimer = null, saveTimer = null, candTimer = null;
  var stopRequested = false, guardTimer = null;
  var panelHeight = Math.round((window.innerHeight || 640) * 0.32);

  /* ==================== 语法着色 ==================== */
  var KW1 = ['def','class','import','from','as','return','yield','lambda','global','nonlocal','async','await','del'];
  var KW2 = ['if','elif','else','for','while','try','except','finally','with','break','continue','pass','raise',
             'assert','in','is','and','or','not','match','case'];
  var KW3 = ['True','False','None'];      /* 修改 2：特殊常量 → 橙色 */
  var KW4 = ['self','cls'];               /* 上下文名 → 青色 */
  var BUILTINS = ['print','input','len','range','int','str','float','bool','list','dict','set','tuple','type','sum','min','max',
    'abs','round','sorted','reversed','enumerate','zip','map','filter','open','isinstance','issubclass','super','repr','id','hash',
    'ord','chr','hex','bin','oct','divmod','pow','any','all','iter','next','format','getattr','setattr','hasattr','dir','vars',
    'globals','locals','callable','eval','exec','compile','exit','quit','help','object','bytes','bytearray','frozenset','complex','slice'];
  var S_KW1 = {}, S_KW2 = {}, S_KW3 = {}, S_KW4 = {}, S_BI = {};
  KW1.forEach(function (w) { S_KW1[w] = 1; });
  KW2.forEach(function (w) { S_KW2[w] = 1; });
  KW3.forEach(function (w) { S_KW3[w] = 1; });
  KW4.forEach(function (w) { S_KW4[w] = 1; });
  BUILTINS.forEach(function (w) { S_BI[w] = 1; });
  var OPS = '+-*/%=<>!&|^~@';

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function span(cls, s) { return '<span class="' + cls + '">' + esc(s) + '</span>'; }

  /* 修改 1：统一的字符串扫描
     - 三引号（''' / """）：遇到换行继续扫描，直到配对的三个引号才结束
     - 单引号（' / "）：遇到换行立即中断（未闭合）
     返回 {end, closed, nl, tri}，nl 为字符串内部包含的换行数 */
  function scanString(src, i) {
    var c = src[i], n = src.length;
    var tri = (src.substr(i, 3) === c + c + c);
    var q = tri ? c + c + c : c;
    var j = i + q.length, closed = false, nl = 0, ch;
    while (j < n) {
      ch = src[j];
      if (ch === '\\') { j += 2; continue; }
      if (tri) {
        if (src.substr(j, 3) === q) { j += 3; closed = true; break; }
        if (ch === '\n') { nl++; }
        j++;
      } else {
        if (ch === c) { j++; closed = true; break; }
        if (ch === '\n') { break; }   /* 单引号遇换行即中断 */
        j++;
      }
    }
    return { end: j, closed: closed, nl: nl, tri: tri };
  }

  function highlight(src) {
    var outHtml = '', i = 0, n = src.length, c, j, w, m, cls, s;
    var isIdChar = function (ch) { return /[A-Za-z0-9_\u4e00-\u9fff]/.test(ch); };
    /* 收集自定义函数名：本文件里 def 出来的都算 */
    var customFuncs = new Set();
    var defRe = /\bdef\s+([A-Za-z_][A-Za-z0-9_]*)/g, defM;
    while ((defM = defRe.exec(src)) !== null) { customFuncs.add(defM[1]); }
    while (i < n) {
      c = src[i];
      if (c === '#') {
        j = src.indexOf('\n', i); if (j < 0) { j = n; }
        outHtml += span('cm', src.slice(i, j)); i = j; continue;
      }
      if (c === '"' || c === "'") {
        s = scanString(src, i);
        outHtml += span('st', src.slice(i, s.end)); i = s.end; continue;
      }
      if (/[A-Za-z_\u4e00-\u9fff]/.test(c)) {
        j = i;
        while (j < n && isIdChar(src[j])) { j++; }
        w = src.slice(i, j);
        cls = null;
        if (S_KW1[w]) { cls = 'k1'; }
        else if (S_KW2[w]) { cls = 'k2'; }
        else if (S_KW3[w]) { cls = 'kbool'; }
        else if (S_KW4[w]) { cls = 'kc'; }
        else if (S_BI[w]) { cls = 'bi'; }
        else if (src[j] === '(') {
          /* 有括号才细分：内置 / 自定义 / 类名 / 普通变量 */
          if (S_BI[w]) {
            cls = 'bi';                     /* 内置函数，保持原有颜色 */
          } else if (customFuncs.has(w)) {
            cls = 'fn-user';                /* 自定义函数 */
          } else if (w[0] === w[0].toUpperCase() && w[0] !== w[0].toLowerCase()) {
            cls = 'fn';                     /* 首字母大写的类名 */
          }
          /* 普通变量如 a()，不给 cls，保持正文色 */
        }
        outHtml += cls ? span(cls, w) : esc(w);
        i = j; continue;
      }
      if (c >= '0' && c <= '9') {
        m = /^(0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|\d[\d_]*(\.\d[\d_]*)?([eE][+-]?\d+)?|\.\d+)/.exec(src.slice(i));
        w = m ? m[0] : c;
        outHtml += span('nu', w); i += w.length; continue;
      }
      if (OPS.indexOf(c) >= 0) { outHtml += span('op', c); i++; continue; }
      outHtml += esc(c); i++;
    }
    return outHtml;
  }

  /* 把字符串与注释替换成空格，保留长度与换行（用于静态扫描） */
  function stripNonCode(src) {
    var a = src.split(''), i = 0, n = src.length, c, s, k;
    while (i < n) {
      c = src[i];
      if (c === '#') {
        while (i < n && src[i] !== '\n') { a[i] = ' '; i++; }
        continue;
      }
      if (c === '"' || c === "'") {
        s = scanString(src, i);
        for (k = i; k < s.end && k < n; k++) { if (src[k] !== '\n') { a[k] = ' '; } }
        i = s.end; continue;
      }
      i++;
    }
    return a.join('');
  }

  /* ==================== 渲染与滚动同步 ==================== */
  function update() {
    var v = ed.value;
    hl.innerHTML = highlight(v) + '\n';
    var lines = v.split('\n').length;
    if (lines !== lastLines) {
      var s = '';

  /* ==================== 新增 1：第三方库（micropip）安装 ==================== */
  var PKG_PRESETS = ['numpy', 'pandas', 'matplotlib', 'jieba', 'openpyxl'];

  /* 依次尝试几种常见的包目录写法，判断某个库是否已经在虚拟盘里 */
  function pkgPresent(py, name) {
    var base = name.split('.')[0].replace(/-/g, '_');
    var py_code = 'import os as _o\n' +
      '_n = ' + JSON.stringify(base) + '\n' +
      '_f = _o.path.join("/home/pyodide", _n)\n' +
      '(_o.path.isfile(_f) and _f.endswith(".py")) or _o.path.isdir(_f) or ' +
      '_o.path.isdir(_f + ".dist-info") or _o.path.isdir("/home/pyodide/" + _n + "-0.dist-info")';
    try { return !!py.runPython(py_code); } catch (e) { return false; }
  }

  async function installPkg(name) {
    var py = await ensurePyodide();
    await py.loadPackage('micropip');   /* 幂等兜底：已加载则立即返回，没加载则现装 */
    var log = function (t, c) { writeOut(t + '\n', c || 'sys'); };
    try {
      py.globals.set('_dsh_pkg', name);
      log('[系统] 正在解析并安装 ' + name + ' …');
      await withTimeout(
        py.runPythonAsync('import micropip\nawait micropip.install(_dsh_pkg)'),
        180000,
        name
      );
      log('[系统] 已成功安装 ' + name + '，现在可以在代码里 import ' + name.split('.')[0].replace(/-/g, '_') + ' 了。', 'ok');
      setStatus('已安装 ' + name, 'ok');
      return true;
    } catch (e) {
      var m = (e && e.message) ? e.message : String(e);
      if (pkgPresent(py, name)) {
        log('[系统] ' + name + ' 之前在虚拟盘中已存在，本次无需重新下载。', 'ok');
        setStatus(name + ' 已安装', 'ok');
        return true;
      }
      if (/timeout|超时/i.test(m)) {
        log('[系统] 安装 ' + name + ' 超时：网络太慢或该库太大。可稍后重试，或换个网络环境再装。', 'err');
      } else {
        log('[系统] 安装 ' + name + ' 失败：' + m.split('\n').slice(-3).join(' '), 'err');
        log('提示：请确认网络可用；部分库没有纯 Python 版（WebAssembly 轮子），在浏览器里装不上（例如 scipy、torch）。', 'cn');
      }
      setStatus('安装失败：' + name, 'err');
      return false;
    } finally {
      try { py.globals.delete('_dsh_pkg'); } catch (e2) { }
    }
  }

  function withTimeout(promise, ms, label) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var t = setTimeout(function () {
        if (done) { return; }
        done = true;
        reject(new Error('安装 ' + label + ' timeout 超时（' + Math.round(ms / 1000) + ' 秒）'));
      }, ms);
      Promise.resolve(promise).then(function (v) {
        if (done) { return; }
        done = true; clearTimeout(t); resolve(v);
      }, function (e) {
        if (done) { return; }
        done = true; clearTimeout(t); reject(e);
      });
    });
  }

  /* ==================== 新增 2/3：虚拟盘文档扫描与读取 ==================== */
  var DOC_EXT = ['.py', '.txt', '.csv', '.json', '.md', '.png', '.jpg', '.jpeg', '.xlsx', '.xls'];
  var TEXT_EXT = ['.py', '.txt', '.csv', '.json', '.md'];
  function extOf(p) {
    var m = /\.[^.\/\\]+$/.exec(p || '');
    return m ? m[0].toLowerCase() : '';
  }
  function isTextPath(p) {
    var e = extOf(p);
    return TEXT_EXT.indexOf(e) >= 0;
  }
  function fmtSize(n) {
    if (n < 1024) { return n + ' B'; }
    if (n < 1024 * 1024) { return (n / 1024).toFixed(1) + ' KB'; }
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }

  /* 用 Python 侧的 os.walk 扫描虚拟盘，返回全部候选文件（按修改时间倒序） */
  function listVFiles() {
    if (!pyodide) { return []; }
    var exts = JSON.stringify(DOC_EXT);
    var code = 'import os as _o, json as _j\n' +
      '_exts = ' + exts + '\n' +
      '_skip = {".cache", "__pycache__", ".micropip", "site-packages", "node_modules"}\n' +
      '_out = []\n' +
      'for _r, _dirs, _fs in _o.walk("/home/pyodide"):\n' +
      '    _dirs[:] = [_d for _d in _dirs if not _d.startswith(".") and _d not in _skip]\n' +
      '    for _f in _fs:\n' +
      '        if _o.path.splitext(_f)[1].lower() in _exts:\n' +
      '            _p = _o.path.join(_r, _f)\n' +
      '            try:\n' +
      '                _out.append([_p, _o.path.getsize(_p), _o.path.getmtime(_p)])\n' +
      '            except Exception:\n' +
      '                pass\n' +
      '_j.dumps(_out)';
    var raw;
    try { raw = pyodide.runPython(code); } catch (e) { return []; }
    var rows;
    try { rows = JSON.parse(raw); } catch (e2) { return []; }
    return rows
      .map(function (r) { return { path: r[0], size: r[1], mtime: r[2] }; })
      .sort(function (a, b) { return (b.mtime || 0) - (a.mtime || 0); });
  }

  /* 环境刚就绪时先扫一遍，把 Python 自带模块（os.py、_pydecimal.py …）记为基线，
     之后只把“程序自己生成/导入的”文件算作用户文件 */
  function refreshBaseline() {
    FILTER_BASE = {};
    listVFiles().forEach(function (f) { FILTER_BASE[f.path] = 1; });
    return FILTER_BASE;
  }

  function scanVFiles() {
    return listVFiles().filter(function (f) { return !FILTER_BASE || !FILTER_BASE[f.path]; });
  }

  async function readVF(path, asText) {
    var py = pyodide;
    if (asText) { return await py.FS.readFile(path, { encoding: 'utf8' }); }
    return await py.FS.readFile(path);   /* Uint8Array */
  }

  /* ==================== 新增 2：导出虚拟文件到手机 ==================== */
  async function showExport() {
    if (!pyodide) {
      setStatus('请先运行一次代码，准备好 Python 环境后再导出', 'warn');
      writeOut('[系统] 导出需要先初始化 Python 环境，请先点「▶ 运行」。\n', 'sys');
      return;
    }
    var files = scanVFiles();
    if (!files.length) {
      setStatus('虚拟盘里还没有可导出的文件', 'warn');
      writeOut('[系统] 虚拟盘里还没有可导出的文件（可用 open() 写一个，或先用「📥」导入文档）。\n', 'sys');
      return;
    }
    var ov = document.createElement('div');
    ov.className = 'overlay';
    var items = files.map(function (f, i) {
      return '<label><input type="checkbox" class="fck" data-i="' + i + '" checked>' +
        '<span class="fmeta">' + esc(f.path) + '</span>' +
        '<span class="fsize">' + fmtSize(f.size) + '</span></label>';
    }).join('');
    ov.innerHTML = '<div class="modal"><h3>📤 导出虚拟文件</h3>' +
      '<p class="hint">勾选要导出到手机下载目录的文件（共 ' + files.length + ' 个）。</p>' +
      '<div class="filelist" id="fList">' + items + '</div>' +
      '<div class="mact"><button id="eAll">全选/全不选</button><button id="eCancel">取消</button>' +
      '<button id="eGo" class="primary">导出选中文件</button></div>' +
      '</div>';
    document.body.appendChild(ov);
    var cks = Array.prototype.slice.call(ov.querySelectorAll('.fck'));
    ov.querySelector('#eAll').addEventListener('click', function () {
      var anyOff = cks.some(function (c) { return !c.checked; });
      cks.forEach(function (c) { c.checked = anyOff; });
    });
    ov.querySelector('#eCancel').addEventListener('click', function () { closeOverlay(ov); });
    var go = ov.querySelector('#eGo');
    go.addEventListener('click', async function () {
      var pick = cks.filter(function (c) { return c.checked; }).map(function (c) { return files[+c.dataset.i]; });
      if (!pick.length) { setStatus('没有勾选任何文件', 'warn'); return; }
      go.disabled = true; go.textContent = '导出中...';
      setPanel(true);
      var n = 0;
      for (var i = 0; i < pick.length; i++) {
        var f = pick[i];
        try {
          var data = await readVF(f.path, isTextPath(f.path));
          var mime = isTextPath(f.path) ? 'text/plain;charset=utf-8' : 'application/octet-stream';
          var blob = new Blob([data], { type: mime });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = f.path.split('/').pop();
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function (u) { return function () { URL.revokeObjectURL(u); }; }(a.href), 4000);
          n++;
          writeOut('[系统] 已导出 ' + f.path + '（' + fmtSize(f.size) + '）\n', 'ok');
        } catch (e) {
          writeOut('[系统] 导出失败 ' + f.path + '：' + ((e && e.message) ? e.message : e) + '\n', 'err');

    var MAX = 2 * 1024 * 1024;
    if (file.size > MAX) {
      writeOut('[系统] 导入失败：' + file.name + ' 大小 ' + fmtSize(file.size) + '，超过 2MB 限制。\n', 'err');

      return;
    }
    var e = extOf(file.name);
    var isExcel = (e === '.xlsx' || e === '.xls');
    if (isExcel) {
      var choice = await pickExcelLib();
      if (choice === null) { setStatus('已取消导入', 'warn'); return; }
    }
    try {
      var py = await ensurePyodide();
      var target = '/home/pyodide/' + file.name.replace(/^.*[\\\/]/, '');
      var buf = new Uint8Array(await file.arrayBuffer());
      if (isExcel || !isTextPath(file.name)) {
        py.FS.writeFile(target, buf);                       /* 二进制：图片 / Excel */
      } else {
        py.FS.writeFile(target, new TextDecoder('utf-8').decode(buf));   /* 文本 */
      }
      writeOut('[系统] 文档已成功导入，可在代码中读取：' + target + '\n', 'ok');
      if (isExcel) {
        writeOut('读取示例：\n' +
          '  import pandas as pd\n' +
          '  df = pd.read_excel("' + target + '")\n' +
          '  print(df)\n', 'cn');

        writeOut('读取示例：open("' + target + '", encoding="utf-8").read()\n', 'cn');
      }
      setStatus('文档已成功导入，可在代码中读取', 'ok');
    } catch (err) {
      var m = (err && err.message) ? err.message : String(err);

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error('无法加载 ' + src + '，请检查网络连接')); };
      document.head.appendChild(s);
    });
  }

  function ensurePyodide() {
    if (pyodide) { return Promise.resolve(pyodide); }
    if (loading) { return loading; }
    loading = (async function () {
      setStatus('正在加载 Python 环境（首次约 10 MB，请保持联网）…', 'warn');
      await loadScript(PY_URL + 'pyodide.js');
      var p = await loadPyodide({ indexURL: PY_URL });
      await p.loadPackage('micropip');   /* 第三方库安装要用，Python 侧 import micropip 才存在 */
      pyodide = p;
      refreshBaseline();       /* 新增 2/3：把 Python 自带模块记为基线，之后只列用户自己的文件 */
      setStatus('Python 环境已就绪（' + (p.version || '') + '）', 'ok');
      return p;
    })();
    loading.catch(function () { loading = null; });
    return loading;
  }

  function buildSetup(guard) {
    var s = '';

    s += 'from js import dshShouldStop as _dsh_js_stop, dshWrite as _dsh_write, dshPromptNow as _dsh_prompt\n';

    s += 'class _DshWriter:\n';

    s += '    def __init__(self, tag, fd):\n';
    s += '        self.tag = tag\n';
    s += '        self._fd = fd\n';
    s += '    def write(self, text):\n';
    s += '        text = str(text)\n';
    s += '        if text:\n';
    s += '            try:\n';
    s += '                _dsh_write(text, self.tag)\n';
    s += '            except Exception:\n';
    s += '                pass\n';
    s += '        return len(text)\n';
    s += '    def writelines(self, lines):\n';
    s += '        for line in lines:\n';
    s += '            self.write(line)\n';
    s += '    def flush(self):\n';
    s += '        pass\n';
    s += '    def isatty(self):\n';
    s += '        return False\n';
    s += '    def fileno(self):\n';
    s += '        return self._fd\n';
    s += '    def reconfigure(self, **kw):\n';
    s += '        pass\n';
    s += '    def close(self):\n';
    s += '        pass\n';
    s += '_sys.stdout = _DshWriter("out", 1)\n';
    s += '_sys.stderr = _DshWriter("err", 2)\n';
    /* 修改 1：input() 桥接到 JS 原生 prompt；点“取消”返回 None → 抛 EOFError */
    s += 'def _dsh_input(prompt=""):\n';
    s += '    if prompt:\n';
    s += '        _sys.stdout.write(str(prompt))\n';
    s += '        _sys.stdout.flush()\n';
    s += '    res = _dsh_prompt(str(prompt))\n';
    s += '    if res is None:\n';
    s += '        raise EOFError("用户取消了输入，程序已终止")\n';
    s += '    return str(res)\n';
    s += '_b.input = _dsh_input\n';
    s += 'def _dsh_should_stop():\n';
    s += '    try:\n';
    s += '        return bool(_dsh_js_stop())\n';
    s += '    except Exception:\n';
    s += '        return False\n';
    s += '_dsh_orig_sleep = _a.sleep\n';
    s += 'async def _dsh_sleep(delay, result=None):\n';
    s += '    import time as _t\n';
    s += '    try:\n';
    s += '        total = float(delay)\n';
    s += '    except Exception:\n';
    s += '        return await _dsh_orig_sleep(delay, result)\n';
    s += '    end = _t.monotonic() + total\n';
    s += '    while True:\n';
    s += '        if _dsh_should_stop():\n';
    s += '            raise KeyboardInterrupt("用户强制停止运行")\n';
    s += '        left = end - _t.monotonic()\n';
    s += '        if left <= 0:\n';
    s += '            break\n';
    s += '        await _dsh_orig_sleep(left if left < 0.05 else 0.05)\n';
    s += '    return result\n';
    s += '_a.sleep = _dsh_sleep\n';
    if (guard) {
      s += 'import time as _dsh_time\n';
      s += '_dsh_deadline = _dsh_time.monotonic() + ' + GUARD_SECONDS + '\n';
      s += '_dsh_n = [0]\n';
      s += 'def _dsh_trace(frame, event, arg):\n';
      s += '    _dsh_n[0] += 1\n';
      s += '    if _dsh_n[0] % 300 == 0:\n';
      s += '        if _dsh_should_stop():\n';
      s += '            raise KeyboardInterrupt("用户强制停止运行")\n';
      s += '        if _dsh_time.monotonic() > _dsh_deadline:\n';
      s += '            raise KeyboardInterrupt("运行超过 ' + GUARD_SECONDS + ' 秒，已自动中断（疑似无法退出的循环）")\n';

  function explainError(msg, lineOffset) {

      m = /^([A-Za-z_][A-Za-z0-9_.]*)\s*:\s*([\s\S]*)$/.exec(lines[i]);
      if (!m) { m = /^([A-Za-z_][A-Za-z0-9_.]*)$/.exec(lines[i]); }
      if (m && /(Error|Exception|Interrupt|Exit|Warning)$/.test(m[1])) {
        head = m[1].split('.').pop();
        detail = m[2] || '';
        break;
      }
    }
    if (!head) { return; }
    var line = extractLine(msg) - (lineOffset || 0);
    if (line < 1) { line = 0; }
    var info = ERR_TABLE[head] || null;
    var cn = info ? info[0] : '异常';
    var why = info ? info[1] : '程序运行时出现异常，请对照上方原始报错信息检查。';

    writeOut('异常类型：' + head + ' —— ' + cn + '\n', 'cn');

    if (line) {
      writeOut('出错行号：第 ' + line + ' 行\n', 'cn');

    }
    writeOut('原因解释：' + why + '\n', 'cn');
    if (ERR_ALIAS[head]) { writeOut('中英对照：' + head + ' → ' + ERR_ALIAS[head] + '\n', 'cn'); }
  }

  /* ==================== 修改 5：强制停止 ==================== */
  function forceStop() {
    if (!running) { setStatus('当前没有正在运行的代码', 'warn'); return; }
    stopRequested = true;
    setStatus('已请求强制停止…（等待代码让出控制权）', 'warn');
    writeOut('\n[🛑 用户请求强制停止运行]\n', 'err');
    writeOut('说明：若代码中有 time.sleep()（已自动改写为可中断的 await 等待）或正好在等待输入，会立即中断；' +
      '若代码是没有任何等待的死循环，主线程被占满，只能关闭本页重新打开；' +
      '已在保护模式下运行的代码最多 ' + GUARD_SECONDS + ' 秒后自动中断。\n', 'cn');
  }
  $('pstop').addEventListener('click', forceStop);

  function setRunningUI(on) {
    running = on;
    var b1 = $('btnRun'), b2 = $('btnRunSave'), bs = $('pstop');
    b1.disabled = on; b2.disabled = on;
    b1.textContent = on ? '运行中…' : '▶ 运行';
    b2.textContent = on ? '运行中…' : '💾 保存并运行';
    bs.disabled = !on;
    bs.style.opacity = on ? '1' : '.45';
  }

  /* ==================== 运行 ==================== */
  async function execUser(py, prep, original) {
    try {
      await py.runPythonAsync(prep.code);
      return false;
    } catch (err) {
      var m = (err && err.message) ? err.message : String(err);
      if (prep.replaced && /SyntaxError/.test(m) && /await/.test(m)) {
        writeOut('提示：time.sleep() 被改写为 await 后无法用在普通函数内部，已回退为原始代码运行（此时 sleep 会真正阻塞页面）。\n', 'cn');
        await py.runPythonAsync(original);
        return true;
      }
      throw err;
    }
  }

  async function run() {
    if (running) { return; }
    var code = ed.value;
    setPanel(true);
    if (!code.trim()) { clearOut(); writeOut('（代码为空，无法运行）\n', 'err'); return; }

    /* 静态检查 */
    var staticErrs = checkSyntax(code);
    if (staticErrs.length) {
      if (!confirm('静态检查发现问题：\n' + staticErrs.slice(0, 4).join('\n') + '\n\n仍要继续运行吗？')) { return; }
    }
    /* 修改 7：疑似死循环检测 */
    var risky = findRiskyLoops(code);
    var useGuard = false;
    if (risky.length) {
      var goOn = await askRisky(risky.map(function (r) { return r.line; }));
      if (!goOn) { setStatus('已取消运行（检测到可能的无限循环）', 'warn'); return; }
      useGuard = true;
    }
    /* 修改 1：input() 改为运行时逐个弹出原生输入框，这里只统计数量用于提示 */
    var nIn = countInputs(code);
    var prep = prepareCode(code);

    inputSeq = 0;
    stopRequested = false;
    setRunningUI(true);
    clearOut();
    writeOut('▶ 运行 ' + currentFileName + '\n', 'sys');
    if (prep.replaced) {
      writeOut('已自动把 ' + prep.count + ' 处 time.sleep() 改写为 await asyncio.sleep()（可被 🛑 停止按钮中断），并已在开头加入 import asyncio。\n', 'sys');
    }
    if (nIn > 0) {
      writeOut('代码包含 ' + nIn + ' 处 input()：执行到时会弹出系统输入框；点「取消」即中止程序。\n', 'sys');
    }
    if (useGuard) { writeOut('已开启 ' + GUARD_SECONDS + ' 秒自动中断保护。\n', 'warn'); }

    try {
      var py = await ensurePyodide();
      py.setStdout({ batched: function (s) { writeOut(s); } });
      py.setStderr({ batched: function (s) { writeOut(s, 'err'); } });

      await runSetup(py, buildSetup(useGuard));
      var fellBack = await execUser(py, prep, code);

      if (stopRequested) {
        writeOut('\n[已强制停止运行]\n', 'ok');
        setStatus('已强制停止', 'warn');
      } else {
        writeOut('\n[程序结束，没有错误]\n', 'ok');
        setStatus('运行完成' + (fellBack ? '（已回退原始代码）' : ''), 'ok');
      }
    } catch (e) {
      var msg = (e && e.message) ? e.message : String(e);
      if (msg.indexOf('PythonError') === 0) { msg = msg.slice('PythonError'.length).replace(/^\s*:\s*/, ''); }
      writeOut(msg.replace(/\s+$/, '') + '\n', 'err');
      var stopped = /KeyboardInterrupt/.test(msg);
      var timedOut = /自动中断/.test(msg);
      try { explainError(msg, prep.lineOffset); } catch (e2) { }
      if (stopped || stopRequested) {
        writeOut('\n[已强制停止运行，界面已恢复]\n', 'ok');
        setStatus(timedOut ? '已自动中断（疑似死循环）' : '已强制停止', 'warn');
      } else if (/SystemExit/.test(msg)) {
        writeOut('\n[程序已退出]\n', 'sys');
        setStatus('程序已退出', 'warn');
      } else {
        setStatus('运行出错，请看输出面板', 'err');
      }
    } finally {
      if (pyodide) {
        try { pyodide.setStdout(); pyodide.setStderr(); } catch (e3) { }
        clearTrace(pyodide);
      }
      clearTimeout(guardTimer);
      stopRequested = false;
      setRunningUI(false);
      try { ed.focus(); } catch (e4) { }
    }
  }

  /* 修改 4：保存并运行 */
  async function saveAndRun() {
    if (running) { return; }
    var saved = false;
    try { saved = await writeFile(false); } catch (e) { setStatus('保存失败：' + (e.message || e), 'err'); }
    if (!saved) { setStatus('未保存，已取消运行', 'warn'); return; }
    await run();
  }

  /* ==================== 事件绑定 ==================== */
  $('btnRun').addEventListener('click', run);
  $('btnRunSave').addEventListener('click', saveAndRun);
  $('btnMenu').addEventListener('click', showMenu);
  /* 新增 3 / 4：顶栏文档视图与导入 */
  $('btnDoc').addEventListener('click', function () { showDocView(); });
  $('btnImport').addEventListener('click', function () { $('docInput').click(); });
  $('docInput').addEventListener('change', async function (e) {
    var fs = e.target.files;
    if (!fs || !fs.length) { return; }
    if (importBusy) { setStatus('正在导入上一个文件，请稍候…', 'warn'); e.target.value = ''; return; }
    importBusy = true; setPanel(true);
    try { for (var i = 0; i < fs.length; i++) { await importDocFile(fs[i]); } }
    finally { importBusy = false; e.target.value = ''; }
  });

  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey)) { return; }
    var k = (e.key || '').toLowerCase();
    if (k === 's' && e.shiftKey) { e.preventDefault(); doSaveAs(); }
    else if (k === 's') { e.preventDefault(); doSave(); }
    else if (k === 'o') { e.preventDefault(); doOpen(); }
    else if (k === 'n') { e.preventDefault(); doNew(); }
    else if (k === 'enter') { e.preventDefault(); run(); }
  });

  /* ==================== 初始化 ==================== */
  var SAMPLE = '# 欢迎使用手机 Python 程序\n' +
    'name = input("请输入你的名字：")\n' +
    'print("你好，" + name + "！")\n\n' +
    'for i in range(1, 4):\n' +
    '    print("第", i, "行")\n';

  (function init() {
    var savedCode = localStorage.getItem(LS_CODE);
    ed.value = (savedCode === null || savedCode === '') ? SAMPLE : savedCode;
    if (savedCode === null) { setStatus('已载入示例代码，点「▶ 运行」试试（首次需联网）'); }
    else { setStatus('已恢复上次编辑的内容与文件名（自动备份）'); }
    setFname();
    applyFont();
    applySymVisible();
    lastLines = 0;
    update();
    setPanel(false);
    setRunningUI(false);
  })();
})();
</script>
</body>
</html>
